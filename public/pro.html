<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Espace pro · ByEmreh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="pro-config.js"></script>
<style>
  :root{
    --accent:#FF5A2B; --on-accent:#fff;
    --bg:#F4F5F7; --card:#fff; --line:#E5E7EB; --ink:#14161B; --muted:#667085; --muted2:#98A2B3;
    --ok:#15803D; --ok-bg:#ECFDF3; --warn:#B45309; --warn-bg:#FFF6E5; --err:#C0392B; --err-bg:#FEF0EE; --blue:#2563EB; --blue-bg:#EFF4FF;
    --ff:'Inter',system-ui,sans-serif; --ff-d:'Space Grotesk','Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--ff);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  button{cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px;}
  .hidden{display:none !important;}
  svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  /* ── Connexion ── */
  .login{min-height:100vh;display:grid;place-items:center;padding:1.2rem;}
  .login-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:2rem 1.8rem;box-shadow:0 20px 50px -25px rgba(0,0,0,.2);}
  .login-card h1{font-family:var(--ff-d);font-size:1.4rem;margin-bottom:.3rem;}
  .login-card p{color:var(--muted);margin-bottom:1.3rem;}

  /* ── Coquille ── */
  #app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
  aside{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:1.1rem .8rem;display:flex;flex-direction:column;gap:.15rem;overflow-y:auto;}
  .side-brand{display:flex;align-items:center;gap:.65rem;padding:.3rem .5rem 1.1rem;font-family:var(--ff-d);font-weight:700;font-size:1.05rem;}
  .side-brand img{width:32px;height:32px;border-radius:8px;object-fit:cover;}
  .side-brand .dot{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;}
  .nav-btn{display:flex;align-items:center;gap:.7rem;width:100%;padding:.62rem .8rem;border:0;background:none;border-radius:10px;font-weight:600;color:var(--muted);text-align:left;transition:background .15s,color .15s;}
  .nav-btn:hover{background:var(--bg);color:var(--ink);}
  .nav-btn.active{background:color-mix(in srgb,var(--accent) 10%,#fff);color:var(--accent);}
  .nav-btn .n{margin-left:auto;background:var(--accent);color:var(--on-accent);border-radius:99px;font-size:.7rem;font-weight:700;padding:.05rem .48rem;min-width:20px;text-align:center;}
  .side-sep{height:1px;background:var(--line);margin:.7rem .4rem;}
  .side-foot{margin-top:auto;}
  .main{min-width:0;}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.8rem;padding:.85rem 1.4rem;background:rgba(244,245,247,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topbar h2{font-family:var(--ff-d);font-size:1.15rem;flex:1;}
  .burger{display:none;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;place-items:center;}
  .view{padding:1.4rem;max-width:1120px;}
  .scrim{display:none;}
  @media(max-width:900px){
    #app{grid-template-columns:1fr;}
    aside{position:fixed;z-index:70;left:0;top:0;width:270px;transform:translateX(-102%);transition:transform .25s;}
    body.drawer aside{transform:none;box-shadow:0 0 60px rgba(0,0,0,.25);}
    body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(16,20,28,.45);z-index:60;}
    .burger{display:grid;} .view{padding:1rem;} .topbar{padding:.75rem 1rem;}
  }

  /* ── Composants ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.3rem;}
  .card h3{font-family:var(--ff-d);font-size:1rem;margin-bottom:.9rem;}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-bottom:.9rem;flex-wrap:wrap;}
  .card-head h3{margin:0;}
  .grid{display:grid;gap:1rem;}
  .g-kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin-bottom:1rem;}
  .g-2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr));margin-top:1rem;}
  .kpi{padding:1rem 1.1rem;}
  .kpi small{color:var(--muted);font-weight:500;display:block;}
  .kpi b{display:block;font-family:var(--ff-d);font-size:1.9rem;line-height:1.2;margin:.15rem 0;}
  .delta{font-size:.76rem;font-weight:600;color:var(--muted);}
  .delta.up{color:var(--ok);} .delta.down{color:var(--err);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.6rem 1.05rem;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;transition:border-color .15s,background .15s,filter .15s;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .btn.primary:hover{filter:brightness(.93);color:var(--on-accent);}
  .btn.danger{color:var(--err);} .btn.danger:hover{border-color:var(--err);color:var(--err);background:var(--err-bg);}
  .btn.sm{padding:.4rem .75rem;font-size:.82rem;}
  .btn[disabled]{opacity:.55;cursor:wait;}
  .pill{display:inline-block;padding:.12rem .6rem;border-radius:99px;font-size:.74rem;font-weight:600;white-space:nowrap;}
  .p-nouveau{background:var(--blue-bg);color:var(--blue);} .p-en_cours{background:var(--warn-bg);color:var(--warn);}
  .p-gagne,.p-traite,.p-confirme,.p-envoye{background:var(--ok-bg);color:var(--ok);} .p-perdu,.p-annule{background:#F2F4F7;color:var(--muted);}
  .p-echec{background:var(--err-bg);color:var(--err);} .p-ghost{background:#F2F4F7;color:var(--muted);}
  .empty{text-align:center;color:var(--muted);padding:2.2rem 1rem;}
  .empty b{display:block;color:var(--ink);font-family:var(--ff-d);font-size:1rem;margin-bottom:.3rem;}
  .muted{color:var(--muted);} .small{font-size:.8rem;}
  .alert{display:flex;gap:.7rem;align-items:flex-start;padding:.85rem 1rem;border-radius:12px;margin-bottom:1rem;border:1px solid;}
  .alert.err{background:var(--err-bg);border-color:#F6C9C3;color:#8F2A1F;} .alert.info{background:var(--blue-bg);border-color:#C9DAFB;color:#1E3A8A;} .alert.ok{background:var(--ok-bg);border-color:#BFE6CD;color:#166534;}
  .alert .btn{margin-left:auto;}

  /* Mise en route */
  .steps{display:flex;flex-direction:column;gap:.15rem;}
  .step{display:flex;align-items:center;gap:.8rem;padding:.6rem .3rem;border-top:1px solid var(--line);}
  .step:first-child{border-top:0;}
  .step .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;color:#fff;}
  .step.done .ck{background:var(--ok);border-color:var(--ok);}
  .step .ck svg{width:13px;height:13px;stroke-width:3;}
  .step .t{flex:1;min-width:0;} .step .t b{display:block;font-weight:600;} .step .t span{color:var(--muted);font-size:.8rem;}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:.6rem;} .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;}

  /* Graphique & entonnoir */
  .chart-box{position:relative;height:290px;}
  .funnel{display:flex;flex-direction:column;gap:.75rem;}
  .fn b{display:flex;justify-content:space-between;font-weight:600;margin-bottom:.25rem;} .fn b span{color:var(--muted);font-weight:500;}
  .fn .trk{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;} .fn .trk i{display:block;height:100%;background:var(--accent);border-radius:99px;min-width:3px;}
  .li{display:flex;align-items:center;gap:.7rem;padding:.6rem 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;}
  .li:first-child{border-top:0;} .li .t{flex:1;min-width:0;} .li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .li .t span{color:var(--muted);font-size:.8rem;}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;}
  .seg button{border:0;background:none;padding:.3rem .8rem;border-radius:8px;font-weight:600;color:var(--muted);} .seg button.on{background:var(--accent);color:var(--on-accent);}

  /* Listes (devis / messages / rdv) */
  .toolbar{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;}
  .search{flex:1;min-width:190px;max-width:340px;padding:.6rem .9rem;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .chips{display:flex;gap:.4rem;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:#fff;padding:.38rem .8rem;border-radius:99px;font-weight:600;color:var(--muted);font-size:.82rem;}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;} .chip em{font-style:normal;opacity:.65;margin-left:.3rem;}
  .table{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .tr{display:grid;grid-template-columns:2.1fr 1.7fr 1.2fr 1fr .9fr;gap:.8rem;align-items:center;width:100%;padding:.8rem 1.1rem;border:0;border-top:1px solid var(--line);background:#fff;text-align:left;transition:background .12s;}
  .tr:first-child{border-top:0;} .tr:hover{background:#FAFAFB;}
  .tr.head{background:#FAFAFB;font-size:.74rem;color:var(--muted);font-weight:600;cursor:default;} .tr.head:hover{background:#FAFAFB;}
  .tr.c4{grid-template-columns:2.2fr 2fr 1fr .9fr;}
  .tr b{font-weight:600;display:block;} .tr small{color:var(--muted);display:block;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tr .num{font-family:var(--ff-d);font-weight:600;}
  @media(max-width:760px){.tr,.tr.c4{grid-template-columns:1fr auto;gap:.3rem .8rem;padding:.85rem 1rem;} .tr.head{display:none;} .tr .c-mid{grid-column:1/2;} .tr .c-num{grid-column:1/2;} .tr .c-st{grid-column:2/3;grid-row:1/2;} .tr .c-date{grid-column:2/3;grid-row:2/3;text-align:right;}}

  /* Produits */
  .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;}
  .prod{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
  .prod .im{aspect-ratio:3/2;background:linear-gradient(135deg,#F2F4F7,#E9ECF1);display:grid;place-items:center;color:var(--muted2);font-family:var(--ff-d);font-weight:700;font-size:1.4rem;position:relative;}
  .prod .im img{width:100%;height:100%;object-fit:cover;} .prod .im .pill{position:absolute;top:.6rem;left:.6rem;}
  .prod .bd{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.35rem;flex:1;} .prod .bd b{font-family:var(--ff-d);font-size:1rem;}
  .prod .ft{display:flex;gap:.5rem;margin-top:auto;padding-top:.6rem;}
  .prod.off{opacity:.6;}

  /* Formulaires */
  .field{margin-bottom:.95rem;} .field label{display:block;font-weight:600;font-size:.82rem;margin-bottom:.32rem;}
  .field input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]),.field select,.field textarea{width:100%;padding:.62rem .8rem;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent);}
  .field textarea{min-height:90px;resize:vertical;} .field .hint{color:var(--muted);font-size:.78rem;margin-top:.3rem;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;} .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;}
  @media(max-width:560px){.row2,.row3{grid-template-columns:1fr;}}
  .check{display:flex;align-items:center;gap:.55rem;font-weight:600;cursor:pointer;} .check input{width:18px;height:18px;accent-color:var(--accent);}
  .upl{display:flex;align-items:center;gap:.9rem;margin-bottom:1rem;} .upl img,.upl .ph{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted2);font-size:.7rem;}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem;} @media(max-width:560px){.modes{grid-template-columns:1fr;}}
  .mode{border:1.5px solid var(--line);border-radius:12px;padding:.8rem .95rem;background:#fff;text-align:left;} .mode b{display:block;} .mode span{color:var(--muted);font-size:.8rem;}
  .mode.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,#fff);}
  .opt-row{display:grid;grid-template-columns:1.2fr 1.6fr 90px 36px;gap:.5rem;margin-bottom:.5rem;align-items:center;}
  @media(max-width:640px){.opt-row{grid-template-columns:1fr 90px 36px;} .opt-row .od{grid-column:1/-1;order:5;}}
  .opt-row input{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:9px;}
  .preview{background:var(--bg);border-radius:10px;padding:.7rem .9rem;color:var(--muted);font-size:.85rem;}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:.5rem .9rem;margin-bottom:1rem;} .kv dt{color:var(--muted);} .kv dd{font-weight:600;word-break:break-word;}
  code{background:#F2F4F7;padding:.1rem .4rem;border-radius:6px;font-size:.82rem;word-break:break-all;}

  /* Fenêtre modale */
  .scrim2{position:fixed;inset:0;z-index:200;background:rgba(16,20,28,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;overflow-y:auto;}
  .modal{width:100%;max-width:580px;background:#fff;border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);animation:pop .22s cubic-bezier(.22,1,.36,1);}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98);}}
  .m-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.3rem;border-bottom:1px solid var(--line);} .m-head h3{font-family:var(--ff-d);font-size:1.08rem;}
  .m-head .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;}
  .m-body{padding:1.3rem;} .m-foot{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;padding:.95rem 1.3rem;border-top:1px solid var(--line);background:#FAFAFB;border-radius:0 0 18px 18px;}
  .m-foot .spacer{margin-right:auto;}
  .toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:12px;opacity:0;pointer-events:none;transition:all .3s;z-index:400;max-width:92vw;}
  .toast.show{opacity:1;transform:translate(-50%,0);} .toast.err{background:var(--err);}
  .skel{height:110px;border-radius:16px;background:linear-gradient(90deg,#ECEEF1 25%,#F6F7F9 50%,#ECEEF1 75%);background-size:200% 100%;animation:sk 1.2s infinite;} @keyframes sk{to{background-position:-200% 0;}}
  @media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

  /* Fonctions (interrupteurs) */
  .fcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1rem 1.15rem;margin-bottom:.8rem;transition:border-color .2s,box-shadow .2s;}
  .fcard.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 8px 22px -16px var(--accent);}
  .fhead{display:flex;gap:.9rem;align-items:center;}
  .fico{font-size:1.45rem;width:46px;height:46px;border-radius:13px;background:var(--bg);display:grid;place-items:center;flex-shrink:0;}
  .fcard.on .fico{background:color-mix(in srgb,var(--accent) 12%,#fff);}
  .ft2{flex:1;min-width:0;} .ft2 b{display:block;font-family:var(--ff-d);font-size:1rem;} .ft2 span{color:var(--muted);font-size:.86rem;}
  .sw{position:relative;display:inline-block;width:54px;height:30px;flex-shrink:0;cursor:pointer;}
  .sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0;z-index:2;}
  .sw i{position:absolute;inset:0;background:#CBD0D8;border-radius:99px;transition:background .2s;}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;background:#fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s;}
  .sw input:checked + i{background:var(--accent);} .sw input:checked + i::after{transform:translateX(24px);}
  .sw input:focus-visible + i{outline:2.5px solid var(--accent);outline-offset:2px;}
  .fbody{margin-top:1rem;padding-top:1rem;border-top:1px dashed var(--line);}
  .fbody .acts{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem;}
  .hrow{display:grid;grid-template-columns:96px 54px 1fr;gap:.6rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line);} .hrow:first-child{border-top:0;}
  .hrow .tm{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;} .hrow input[type=time]{padding:.4rem .5rem;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .hrow .tm small{color:var(--muted);}
  @media(max-width:560px){.hrow{grid-template-columns:1fr auto;} .hrow .tm{grid-column:1/-1;}}
  .coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem;}
  .ci{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.45rem;} .ci.off{opacity:.6;}
  .ci .stars{color:#F5A623;letter-spacing:.06em;} .ci p{color:var(--ink);white-space:pre-line;font-size:.9rem;} .ci .ft{display:flex;gap:.5rem;margin-top:auto;padding-top:.5rem;}
  .ci img.th{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--bg);}
  .ci .two{display:grid;grid-template-columns:1fr 1fr;gap:4px;} .ci .two img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;}
  .big-empty{text-align:center;padding:2.2rem 1rem;} .big-empty b{display:block;font-size:1.1rem;margin-bottom:.3rem;} .big-empty p{color:var(--muted);margin-bottom:1rem;}
  .p-relance{background:var(--warn-bg);color:var(--warn);}
  .upl{flex-wrap:wrap;} .upl > div{min-width:0;max-width:100%;} .upl input[type=file]{max-width:100%;}
</style>
</head>
<body>

<!-- ══════ Connexion ══════ -->
<div class="login" id="login">
  <form class="login-card" id="loginForm">
    <h1>Espace professionnel</h1>
    <p>Accès réservé au gérant.</p>
    <div class="field"><label for="pw">Code d'accès</label><input type="password" id="pw" autocomplete="current-password" autofocus /></div>
    <button class="btn primary" style="width:100%" id="loginBtn">Se connecter</button>
    <p id="loginErr" class="small" style="color:var(--err);margin:.8rem 0 0"></p>
    <p class="small muted" style="margin:1rem 0 0"><a href="index.html" style="text-decoration:underline">← Retour au site</a></p>
  </form>
</div>

<!-- ══════ Application ══════ -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="side-brand"><span id="sideLogo"></span><span id="sideName">Espace pro</span></div>
    <button class="nav-btn" data-view="dashboard"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Tableau de bord</button>
    <button class="nav-btn" data-view="devis"><svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>Devis<span class="n hidden" id="bDevis"></span></button>
    <button class="nav-btn" data-view="messages"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>Messages<span class="n hidden" id="bMsg"></span></button>
    <button class="nav-btn" data-view="rdv"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Rendez-vous</button>
    <div class="side-sep"></div>

<script>
const API = ((window.APP_CONFIG || {}).API_BASE || '').replace(/\/$/, '');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('fr-FR');
const fd = (iso) => new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
const fdt = (iso) => new Date(iso).toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const img = (u) => (!u ? '' : /^https?:/.test(u) ? u : API + u);
const ST_DEVIS = { nouveau: 'Nouveau', en_cours: 'En cours', gagne: 'Gagné', perdu: 'Perdu' };
const ST_CT = { nouveau: 'Nouveau', traite: 'Traité' };
const pill = (st, map) => `<span class="pill p-${esc(st)}">${esc((map || {})[st] || st)}</span>`;
const CHECK = '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';

let TOKEN = sessionStorage.getItem('adm_t') || '';
let LIST = {}, CONFIG = null, OV = null, DAYS = 30, DEVIS = null, CONTACTS = null, PRODS = null, ARTS = null, RDV = null;
const F = { devis: 'all', dq: '', ct: 'all', cq: '' };
let PENDING_DEVIS = null;

/* ══════════ Réseau ══════════ */
async function api(path, method, body, soft) {
  const res = await fetch(API + path, { method: method || 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN }, body: body ? JSON.stringify(body) : undefined });
  let data = {}; try { data = await res.json(); } catch (e) { /* ignore */ }
  if (res.status === 401 && path !== '/api/admin/login') { logout(true); throw new Error('Session expirée, reconnectez-vous.'); }
  if (!res.ok || (data.ok === false && !soft)) throw new Error(data.error || 'Erreur ' + res.status);
  return data;
}
function toast(msg, err) { const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = 'toast'), 3400); }
let chartP = null;
function loadChart() {
  if (window.Chart) return Promise.resolve();
  if (chartP) return chartP;
  const urls = ['https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js', 'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js'];
  const tryLoad = (i) => new Promise((ok, ko) => {
    if (i >= urls.length) return ko(new Error('Chart.js indisponible'));
    const s = document.createElement('script'); s.src = urls[i];
    s.onload = () => (window.Chart ? ok() : tryLoad(i + 1).then(ok, ko));
    s.onerror = () => { s.remove(); tryLoad(i + 1).then(ok, ko); };
    document.head.appendChild(s);
  });
  chartP = tryLoad(0).catch((e) => { chartP = null; throw e; });
  return chartP;
}
function onAccent(hex) { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#fff'; const n = parseInt(m[1], 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 > 0.62 ? '#14161B' : '#fff'; }
function setAccent(c) { document.documentElement.style.setProperty('--accent', c); document.documentElement.style.setProperty('--on-accent', onAccent(c)); }

/* ══════════ Connexion ══════════ */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('loginErr'), btn = $('loginBtn'); err.textContent = '';
  if (window.APP_CONFIG === undefined || API.includes('TON-SOUS-DOMAINE')) { err.textContent = "Configuration manquante : fichier pro-config.js introuvable."; return; }
  btn.disabled = true;
  try {
    const d = await api('/api/admin/login', 'POST', { password: $('pw').value });
    TOKEN = d.token; sessionStorage.setItem('adm_t', TOKEN); $('pw').value = ''; boot();
  } catch (ex) { err.textContent = ex.message === 'Failed to fetch' ? "Impossible de joindre le serveur. Réessayez dans un instant." : ex.message; }
  btn.disabled = false;
});
function logout(silent) {
  TOKEN = ''; sessionStorage.removeItem('adm_t'); DEVIS = CONTACTS = PRODS = ARTS = RDV = OV = null; LIST = {};
  $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('modalRoot').innerHTML = '';
  if (!silent) toast('Déconnecté');
}
$('logout').onclick = () => logout();

async function boot() {
  try {
    CONFIG = (await api('/api/admin/config')).config;
  } catch (e) { $('login').classList.remove('hidden'); $('loginErr').textContent = e.message; return; }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  applyBrand();
  api('/api/admin/overview?days=30').then((o) => { OV = OV || o; badges(o.a_traiter.nb_devis, o.a_traiter.nb_contacts); }).catch(() => {});
  route();
}
const VIEW_FEAT = { newsletter: 'newsletter', produits: 'produits', simulateur: 'simulateur', rdv: 'rdv', blog: 'blog', avis: 'avis', galerie: 'galerie', faq: 'faq' };
const PRO_HIDDEN = ['devis', 'rdv', 'produits', 'galerie', 'avis', 'faq', 'blog', 'simulateur'];
function applyNav() {
  const F = (CONFIG && CONFIG.features) || {};
  document.querySelectorAll('.nav-btn[data-view]').forEach((b) => { if (PRO_HIDDEN.includes(b.dataset.view)) { b.classList.add('hidden'); return; } const k = VIEW_FEAT[b.dataset.view]; if (k) b.classList.toggle('hidden', F[k] === false || (F[k] === undefined && ['avis', 'galerie', 'faq', 'newsletter'].includes(k))); });
}
function applyBrand() {
  applyNav();
  setAccent(CONFIG.couleur_primaire);
  document.title = 'Espace pro — ' + CONFIG.nom_entreprise;
  $('sideName').textContent = CONFIG.nom_entreprise;
  $('sideLogo').innerHTML = CONFIG.logo_url ? `<img src="${esc(img(CONFIG.logo_url))}" alt="" width="32" height="32"/>` : `<span class="dot">${esc(CONFIG.nom_entreprise.slice(0, 1).toUpperCase())}</span>`;
}
function badges(d, m) {
  const set = (id, n) => { const el = $(id); el.textContent = n; el.classList.toggle('hidden', !n); };
  set('bDevis', d); set('bMsg', m);
}
function refreshBadges() {
  badges(DEVIS ? DEVIS.filter((x) => x.statut === 'nouveau').length : (OV ? OV.a_traiter.nb_devis : 0), CONTACTS ? CONTACTS.filter((x) => x.statut === 'nouveau').length : (OV ? OV.a_traiter.nb_contacts : 0));
}

/* ══════════ Navigation ══════════ */
const TITLES = { newsletter: 'Newsletter', fonctions: 'Fonctions du site', galerie: 'Réalisations', avis: 'Avis clients', faq: 'Questions fréquentes', dashboard: 'Tableau de bord', devis: 'Devis', messages: 'Messages', rdv: 'Rendez-vous', produits: 'Produits et prestations', blog: 'Blog', simulateur: 'Simulateur de devis', reglages: 'Réglages' };
function route() {
  if (!TOKEN) return;
  let v = location.hash.replace(/^#\/?/, '') || 'dashboard'; if (!VIEWS[v]) v = 'dashboard';
  document.querySelectorAll('.nav-btn[data-view]').forEach((b) => b.classList.toggle('active', b.dataset.view === v));
  $('pageTitle').textContent = TITLES[v]; $('topActions').innerHTML = ''; $('view').oninput = null; $('view').onchange = null; $('view').onclick = null;
  document.body.classList.remove('drawer'); window.scrollTo(0, 0);
  $('view').innerHTML = '<div class="grid g-kpi"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  VIEWS[v]().catch((e) => { $('view').innerHTML = `<div class="alert err">${esc(e.message)}</div>`; });
}
window.addEventListener('hashchange', route);
document.querySelectorAll('.nav-btn[data-view]').forEach((b) => (b.onclick = () => { const t = '#/' + b.dataset.view; if (location.hash === t) route(); else location.hash = t; }));
$('burger').onclick = () => document.body.classList.toggle('drawer');
$('scrim').onclick = () => document.body.classList.remove('drawer');
const go = (v) => { location.hash = '#/' + v; };

/* ══════════ Fenêtres modales ══════════ */
function modal(title, body, foot) {
  $('modalRoot').innerHTML = `<div class="scrim2" data-close-bg><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="m-head"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Fermer">✕</button></div><div class="m-body">${body}</div><div class="m-foot">${foot || ''}</div></div></div>`;
  return $('modalRoot').querySelector('.modal');
}
const closeModal = () => ($('modalRoot').innerHTML = '');
$('modalRoot').addEventListener('click', (e) => { if (e.target.closest('[data-close]') || e.target.matches('[data-close-bg]')) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ══════════ Images : réduites avant envoi (les photos de téléphone dépassent souvent 5 Mo) ══════════ */
async function shrink(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 600000) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/webp', 0.85));
    return blob ? new File([blob], 'image.webp', { type: 'image/webp' }) : file;
  } catch (e) { return file; }
}
async function uploadImage(file) {
  const f = await shrink(file);
  const fd2 = new FormData(); fd2.append('file', f);
  const r = await fetch(API + '/api/admin/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN }, body: fd2 });
  const d = await r.json(); if (!d.ok) throw new Error(d.error || 'Échec');
  return d.url;
}
function bindUpload(fileId, hiddenId, prevId) {
  $(fileId).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const prev = $(prevId); prev.outerHTML = `<div class="ph" id="${prevId}">Envoi…</div>`;
    try {
      const url = await uploadImage(f); $(hiddenId).value = url;
      $(prevId).outerHTML = `<img id="${prevId}" src="${esc(img(url))}" alt="" />`;
    } catch (ex) { $(prevId).outerHTML = `<div class="ph" id="${prevId}">Aucune</div>`; toast(ex.message, true); }
  });
}
const uploadBlock = (id, url) => `<div class="upl">${url ? `<img id="${id}Prev" src="${esc(img(url))}" alt="" />` : `<div class="ph" id="${id}Prev">Aucune</div>`}<div><input type="file" id="${id}File" accept="image/*" /><div class="small muted" style="margin-top:.3rem">Redimensionnée automatiquement.</div></div><input type="hidden" id="${id}Url" value="${esc(url || '')}" /></div>`;

/* ══════════ VUES ══════════ */
const VIEWS = {};

/* ── Tableau de bord ── */
const delta = (c, p) => {
  if (!p) return c ? '<span class="delta up">Nouveau</span>' : '<span class="delta">—</span>';
  const v = Math.round(((c - p) / p) * 100);
  return `<span class="delta ${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '▲' : '▼'} ${Math.abs(v)} % vs période préc.</span>`;
};
let chartInst = null;
VIEWS.dashboard = async () => {
  const o = OV = await api('/api/admin/overview?days=' + DAYS);
  badges(o.a_traiter.nb_devis, o.a_traiter.nb_contacts);
  const s = o.setup;
  const FT0 = o.features || {};
  const steps = [
    { ok: s.pro_email, t: 'Email de réception', d: 'Adresse qui reçoit les messages et les devis', v: 'reglages' },
    { ok: s.resend_key, t: 'Envoi des emails', d: 'Clé Resend ajoutée au serveur', v: 'reglages' },
    ...(FT0.contact_email ? [] : [{ ok: s.formspree, t: 'Formulaire de contact', d: 'Identifiant Formspree dans les réglages', v: 'reglages' }]),
    ...(FT0.rdv !== false ? [{ ok: s.cal, t: 'Prise de rendez-vous', d: 'Lien Cal.com dans les réglages', v: 'reglages' }] : []),
    ...(FT0.produits !== false ? [{ ok: s.stripe_produits > 0, t: 'Un produit avec lien Stripe', d: 'Bouton « Commander » sur le site', v: 'produits' }] : []),
  ];
  const FT = o.features || {};
  if (FT.avis) steps.push({ ok: o.contenu.a > 0, t: 'Un premier avis client', d: 'Rassure les visiteurs', v: 'avis' });
  if (FT.galerie) steps.push({ ok: o.contenu.g > 0, t: 'Une première photo de réalisation', d: 'Montrez votre travail', v: 'galerie' });
  if (FT.faq) steps.push({ ok: o.contenu.f > 0, t: 'Une première question fréquente', d: 'Répond avant même qu\'on vous appelle', v: 'faq' });
  const done = steps.filter((x) => x.ok).length;
  const kp = [['Visites', 'visites'], ...(FT.simulateur !== false ? [['Devis reçus', 'devis']] : []), ['Messages', 'messages'], ['Clics paiement (Stripe)', 'achats'], ...(FT.rdv !== false ? [['Rendez-vous', 'rdv']] : [])];
  if (FT.whatsapp) kp.push(['Clics WhatsApp', 'wa']);
  const conv = o.cur.visites ? Math.round(((o.cur.devis + o.cur.messages + o.cur.rdv) / o.cur.visites) * 1000) / 10 : 0;
  const simS = Math.max(o.cur.sim_start, o.cur.devis);
  const pct = (a, b) => (b ? Math.min(100, Math.round((a / b) * 100)) : 0);
  const alerts = [];
  if (o.setup.emails_en_echec > 0) alerts.push(`<div class="alert err"><div><b>${o.setup.emails_en_echec} ${o.setup.emails_en_echec > 1 ? "emails n'ont pas pu partir" : "email n'a pas pu partir"}</b> (les messages et devis sont bien enregistrés dans leurs onglets). Testez l'envoi pour voir la cause.</div><button class="btn sm" data-go="reglages">Tester l'envoi</button></div>`);
  if (s.resend_key && s.resend_from_test) alerts.push(`<div class="alert info"><div>Expéditeur de test actif : Resend n'envoie qu'à l'email de <b>votre compte Resend</b>. Pour écrire à n'importe quelle adresse, vérifiez un domaine dans Resend puis changez <code>RESEND_FROM</code>.</div></div>`);

  const rl = o.a_relancer || { n: 0, liste: [], jours: 3 };
  if (FT.relance && rl.n > 0) alerts.push(`<div class="card" style="margin-bottom:1rem;border-color:#F3D9A4;background:var(--warn-bg)"><div class="card-head"><h3>⏰ ${rl.n} devis sans réponse depuis plus de ${rl.jours} jour${rl.jours > 1 ? 's' : ''}</h3></div>${rl.liste.map((d) => `<div class="li"><span class="t"><b>${esc(d.nom)}</b><span>${esc(d.prestation)} · reçu le ${fd(d.created_at)}</span></span><button class="btn sm primary" data-relance="${d.id}" data-mail="${esc(d.email)}" data-nom="${esc(d.nom)}" data-prest="${esc(d.prestation)}" data-date="${esc(d.created_at)}">Relancer</button></div>`).join('')}</div>`);
  $('topActions').innerHTML = `<div class="seg" id="seg">${[7, 30, 90].map((d) => `<button data-d="${d}" class="${d === DAYS ? 'on' : ''}">${d} j</button>`).join('')}</div>`;
  $('seg').onclick = (e) => { const b = e.target.closest('button'); if (b) { DAYS = +b.dataset.d; route(); } };

  $('view').innerHTML = `${alerts.join('')}
    ${done < steps.length ? `<div class="card" style="margin-bottom:1rem"><div class="card-head"><h3>Mise en route</h3><span class="muted small">${done} sur ${steps.length}</span></div><div class="bar"><i style="width:${(done / steps.length) * 100}%"></i></div><div class="steps">${steps.map((x) => `<div class="step ${x.ok ? 'done' : ''}"><span class="ck">${x.ok ? CHECK : ''}</span><div class="t"><b>${x.t}</b><span>${x.d}</span></div>${x.ok ? '' : `<button class="btn sm" data-go="${x.v}">Configurer</button>`}</div>`).join('')}</div></div>` : ''}
    <div class="grid g-kpi">${kp.map(([l, k]) => `<div class="card kpi"><small>${l}</small><b>${fmt(o.cur[k])}</b>${delta(o.cur[k], o.prev[k])}</div>`).join('')}</div>
    <div class="card"><div class="card-head"><h3>Activité sur ${o.days} jours</h3><span class="muted small">Taux de conversion : <b>${String(conv).replace('.', ',')} %</b></span></div><div class="chart-box"><canvas id="ch"></canvas></div></div>
    <div class="grid g-2">
      <div class="card"><h3>À traiter</h3>${(o.a_traiter.devis.length + o.a_traiter.contacts.length) ? `${o.a_traiter.devis.map((d) => `<button class="li" data-open-devis="${d.id}"><span class="t"><b>${esc(d.nom)}</b><span>Devis · ${esc(d.prestation)} · ${fd(d.created_at)}</span></span>${d.mode === 'affiche' ? `<b class="num">${fmt(d.estimation_min)}–${fmt(d.estimation_max)} €</b>` : ''}</button>`).join('')}${o.a_traiter.contacts.map((c) => `<button class="li" data-go="messages"><span class="t"><b>${esc(c.nom)}</b><span>Message · ${esc(c.message.slice(0, 60))}</span></span>${pill('nouveau', ST_CT)}</button>`).join('')}` : '<div class="empty"><b>Tout est à jour</b>Aucune demande en attente.</div>'}</div>
      <div class="card"><h3>Parcours des visiteurs</h3><div class="funnel">
        <div class="fn"><b>Visites <span>${fmt(o.cur.visites)}</span></b><div class="trk"><i style="width:100%"></i></div></div>
        <div class="fn"><b>Simulations démarrées <span>${fmt(simS)} · ${pct(simS, o.cur.visites)} %</span></b><div class="trk"><i style="width:${pct(simS, o.cur.visites)}%"></i></div></div>
        <div class="fn"><b>Devis envoyés <span>${fmt(o.cur.devis)} · ${pct(o.cur.devis, simS)} % des simulations</span></b><div class="trk"><i style="width:${pct(o.cur.devis, o.cur.visites)}%"></i></div></div>
      </div></div>

/* ── Relance d'un devis : ouvre l'email déjà rédigé, puis note la relance ── */
async function relancer(d) {
  const nom = d.nom || '', date = d.date ? new Date(d.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) : '';
  const body = `Bonjour ${nom},\n\nJe me permets de revenir vers vous au sujet de votre demande de devis${d.prest ? ' (' + d.prest + ')' : ''}${date ? ' du ' + date : ''}.\nSouhaitez-vous que nous en parlions ? Je reste à votre disposition.\n\nBien cordialement,\n${CONFIG.nom_entreprise}${CONFIG.telephone ? '\n' + CONFIG.telephone : ''}`;
  window.location.href = 'mailto:' + d.mail + '?subject=' + encodeURIComponent('Votre demande de devis — ' + CONFIG.nom_entreprise) + '&body=' + encodeURIComponent(body);
  try { await api('/api/admin/devis/' + d.relance, 'PUT', { relance: true }); toast('Relance notée — le rappel disparaît de la liste'); if (DEVIS) { const x = DEVIS.find((y) => y.id === +d.relance); if (x) x.relance_le = new Date().toISOString(); } setTimeout(() => route(), 600); } catch (e) { toast(e.message, true); }

/* ── Export CSV (Excel FR : séparateur « ; ») ── */
function exportCsv(kind) {
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""').replace(/\n/g, ' ') + '"';
  let head, rows;
  if (kind === 'devis') {
    head = ['Date', 'Nom', 'Email', 'Téléphone', 'Prestation', 'Quantité', 'Unité', 'Options', 'Estimation min', 'Estimation max', 'Statut', 'Message', 'Note'];
    rows = DEVIS.map((d) => { let o = []; try { o = JSON.parse(d.options_json).map((x) => x.label); } catch (e) { /* ignore */ } return [d.created_at.slice(0, 16).replace('T', ' '), d.nom, d.email, d.tel, d.prestation, d.quantite, d.unite, o.join(' + '), d.mode === 'affiche' ? d.estimation_min : '', d.mode === 'affiche' ? d.estimation_max : '', ST_DEVIS[d.statut], d.message, d.note]; });
  } else {
    head = ['Date', 'Nom', 'Email', 'Téléphone', 'Sujet', 'Message', 'Statut'];
    rows = CONTACTS.map((c) => [c.created_at.slice(0, 16).replace('T', ' '), c.nom, c.email, c.tel, c.prestation_interessee, c.message, ST_CT[c.statut]]);
  }
  const csv = '\ufeff' + [head, ...rows].map((r) => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = kind + '-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

      <div class="row3"><div class="field"><label for="sUP">Prix par unité (€)</label><input id="sUP" type="number" min="0" step="0.01" /><div class="hint">Modifiable produit par produit.</div></div><div class="field"><label for="sUL">Nom de l'unité</label><input id="sUL" maxlength="30" placeholder="m², heures, personnes…" /></div><div class="field"><label for="sDef">Quantité par défaut</label><input id="sDef" type="number" min="1" /></div></div>
      <div class="row2"><div class="field"><label for="sMin">Quantité minimale</label><input id="sMin" type="number" min="1" /></div><div class="field"><label for="sMax">Quantité maximale</label><input id="sMax" type="number" min="1" /></div></div>
      <div class="row2"><div class="field"><label for="sLow">Fourchette basse (%)</label><input id="sLow" type="number" min="-90" max="0" /></div><div class="field"><label for="sHigh">Fourchette haute (%)</label><input id="sHigh" type="number" min="0" max="300" /></div></div>
      <div class="preview" id="simPrev"></div></div>
    <div class="card"><div class="card-head"><h3>Options proposées</h3><button class="btn sm" id="addOpt">+ Ajouter une option</button></div><div id="optRows"></div></div>`;
  paintSim();
  $('view').oninput = simInput;
  $('view').querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => { SIM.mode = b.dataset.mode; paintModes(); }));
  $('addOpt').onclick = () => { readSim(); SIM.options.push({ key: '', label: '', desc: '', price: 0 }); paintOpts(); };
};
function paintSim() {
  $('sUP').value = SIM.unit_price; $('sUL').value = SIM.unit_label; $('sDef').value = SIM.qty_default; $('sMin').value = SIM.qty_min; $('sMax').value = SIM.qty_max; $('sLow').value = SIM.range_low; $('sHigh').value = SIM.range_high;
  paintModes(); paintOpts(); simPreview();
}
function paintModes() { $('view').querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === SIM.mode)); }
function paintOpts() {
  $('optRows').innerHTML = SIM.options.length ? SIM.options.map((o, i) => `<div class="opt-row" data-i="${i}"><input class="ol" placeholder="Nom de l'option" value="${esc(o.label)}" /><input class="od" placeholder="Courte description" value="${esc(o.desc)}" /><input class="op" type="number" step="0.01" value="${o.price}" aria-label="Prix" /><button class="btn sm danger" data-rm="${i}" aria-label="Retirer">✕</button></div>`).join('') : '<div class="empty">Aucune option : le client passe directement à l\'estimation.</div>';
  $('optRows').querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { readSim(); SIM.options.splice(+b.dataset.rm, 1); paintOpts(); }));
}
function readSim() {
  SIM.unit_price = +$('sUP').value || 0; SIM.unit_label = $('sUL').value || 'unité(s)'; SIM.qty_default = +$('sDef').value || 1; SIM.qty_min = +$('sMin').value || 1; SIM.qty_max = +$('sMax').value || 1; SIM.range_low = +$('sLow').value || 0; SIM.range_high = +$('sHigh').value || 0;
  SIM.options = [...$('optRows').querySelectorAll('.opt-row')].map((r, i) => ({ key: (SIM.options[i] && SIM.options[i].key) || '', label: r.querySelector('.ol').value, desc: r.querySelector('.od').value, price: +r.querySelector('.op').value || 0 }));
}
function simInput() { if (!$('sUP')) return; readSim(); simPreview(); }
function simPreview() {
  const tot = SIM.unit_price * SIM.qty_default, r5 = (x) => Math.round(x / 5) * 5;
  $('simPrev').innerHTML = `Exemple : ${fmt(SIM.qty_default)} ${esc(SIM.unit_label)} × ${fmt(SIM.unit_price)} € = <b>${fmt(tot)} €</b> → le client verrait <b>${fmt(r5(tot * (1 + SIM.range_low / 100)))} € – ${fmt(r5(tot * (1 + SIM.range_high / 100)))} €</b>${SIM.mode === 'masque' ? ' <span class="muted">(masqué en mode « prix masqué »)</span>' : ''}`;
}
async function saveSim() {
  readSim(); paintModes();
  try { await saveConfig({ sim: SIM }); toast('Simulateur mis à jour sur le site'); } catch (e) { toast(e.message, true); }
}
async function saveConfig(patch) {
  const body = { ...CONFIG, ...patch };
  const d = await api('/api/admin/config', 'POST', body);
  CONFIG = (await api('/api/admin/config')).config; applyBrand(); return d;
}

function featCard(f) {
  const c = CONFIG, on = !!c.features[f.k], w = f.warn ? f.warn(c) : '';
  const body = on ? `<div class="fbody">${w ? `<div class="alert err" style="margin-bottom:.8rem"><div>${w}</div></div>` : ''}${f.fields ? FIELDS[f.fields](c, c.extras) : ''}<div class="acts">${f.fields ? `<button class="btn primary sm" data-fsave="${f.fields}">Enregistrer</button>` : ''}${f.go ? `<button class="btn sm ${f.fields ? '' : 'primary'}" data-fgo="${f.go}">${f.gl}</button>` : ''}</div></div>` : '';
  return `<div class="fcard ${on ? 'on' : ''}" id="fc_${f.k}"><div class="fhead"><span class="fico">${f.ico}</span><div class="ft2"><b>${f.t}</b><span>${f.d}</span></div><label class="sw"><input type="checkbox" data-sw="${f.k}" ${on ? 'checked' : ''} aria-label="${esc(f.t)}" /><i></i></label></div>${body}</div>`;
}
VIEWS.fonctions = async () => {
  CONFIG = (await api('/api/admin/config')).config; applyNav();
  $('view').innerHTML = `<div class="alert info"><div><b>Activez seulement ce dont vous avez besoin.</b> Chaque interrupteur ajoute ou retire la fonction sur votre site, tout de suite. Rien n'est définitif : vous pouvez changer d'avis quand vous voulez.</div></div>${FEATS.filter((f) => PRO_FEATS.includes(f.k)).map(featCard).join('')}`;
  afterFeat();
  $('view').onchange = async (e) => {
    const sw = e.target.closest('[data-sw]'); if (!sw) return;
    const k = sw.dataset.sw, on = sw.checked;
    try {
      await saveConfig({ features: { ...CONFIG.features, [k]: on } }); applyNav();
      $('fc_' + k).outerHTML = featCard(FEATS.find((f) => f.k === k)); afterFeat();
      toast(on ? 'Activé — visible sur votre site' : 'Désactivé — retiré de votre site');
    } catch (err) { sw.checked = !on; toast(err.message, true); }
  };
  $('view').onclick = async (e) => {
    const g = e.target.closest('[data-fgo]'); if (g) return go(g.dataset.fgo);
    const b = e.target.closest('[data-fsave]'); if (!b) return;
    b.disabled = true;
    try { await saveConfig({ extras: READ[b.dataset.fsave]() }); toast('Enregistré — le site est à jour'); } catch (err) { toast(err.message, true); }
    b.disabled = false;
  };
};

    ready: () => { bindUpload('giFile', 'giUrl', 'giPrev'); bindUpload('gaFile', 'gaUrl', 'gaPrev'); $('gaClear').onclick = () => { $('gaUrl').value = ''; $('gaPrev').outerHTML = '<div class="ph" id="gaPrev">Aucune</div>'; }; },
    read: () => ({ image_url: $('giUrl').value, image_apres_url: $('gaUrl').value, titre: $('cTi').value, legende: $('cLe').value }),

['avis', 'galerie', 'faq'].forEach((key) => {
  VIEWS[key] = async () => {
    LIST[key] = (await api('/api/admin/' + key)).items;
    $('topActions').innerHTML = `<button class="btn primary sm" id="addC">${COLLS[key].add}</button>`;
    $('addC').onclick = () => collForm(key, null);
    drawColl(key);
  };
});
function drawColl(key) {
  const C = COLLS[key], list = LIST[key], on = !!(CONFIG.features || {})[key];
  $('view').innerHTML = (on ? '' : `<div class="alert info"><div>Cette fonction est <b>désactivée</b> : rien ne s'affiche sur le site pour le moment.</div><button class="btn sm primary" id="actC">Activer</button></div>`)
    + (list.length
      ? `<div class="coll">${list.map((x) => `<div class="ci ${x.actif ? '' : 'off'}">${C.card(x)}${x.actif ? '' : '<span class="pill p-perdu" style="align-self:flex-start">Masqué</span>'}<div class="ft"><button class="btn sm" data-ec="${x.id}">Modifier</button><button class="btn sm danger" data-dc="${x.id}">Supprimer</button></div></div>`).join('')}</div>`
      : `<div class="card big-empty"><b>${C.emptyT}</b><p>${C.emptyD}</p><button class="btn primary" id="addC2">${C.add}</button></div>`);
  if ($('addC2')) $('addC2').onclick = () => collForm(key, null);
  if ($('actC')) $('actC').onclick = async () => { try { await saveConfig({ features: { ...CONFIG.features, [key]: true } }); applyNav(); toast('Activé — visible sur votre site'); drawColl(key); } catch (e) { toast(e.message, true); } };
  $('view').querySelectorAll('[data-ec]').forEach((b) => (b.onclick = () => collForm(key, list.find((x) => x.id === +b.dataset.ec))));
  $('view').querySelectorAll('[data-dc]').forEach((b) => (b.onclick = async () => {
    if (!confirm(C.del)) return;
    try { await api('/api/admin/' + key + '/' + b.dataset.dc, 'DELETE'); LIST[key] = LIST[key].filter((x) => x.id !== +b.dataset.dc); drawColl(key); toast('Supprimé'); } catch (e) { toast(e.message, true); }
  }));
}
function collForm(key, x) {
  const C = COLLS[key], cur = x || { ...C.blank, ordre: LIST[key].length + 1 };
  modal(x ? 'Modifier' : C.add.replace('+ ', ''), `${C.form(cur)}<div class="row2"><div class="field"><label for="cO">Position (1 = en premier)</label><input id="cO" type="number" min="0" value="${cur.ordre == null ? LIST[key].length + 1 : cur.ordre}" /></div><div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" id="cA" ${cur.actif ? 'checked' : ''} /> Visible sur le site</label></div></div>`,
    `<button class="btn" data-close>Annuler</button><button class="btn primary" id="cSave">Enregistrer</button>`);
  if (C.ready) C.ready();
  $('cSave').onclick = async () => {
    const body = { ...C.read(), ordre: +$('cO').value || 0, actif: $('cA').checked };
    try {
      await api('/api/admin/' + key + (x ? '/' + x.id : ''), x ? 'PUT' : 'POST', body);
      closeModal(); toast('Enregistré — visible sur le site');
      LIST[key] = (await api('/api/admin/' + key)).items; drawColl(key);
    } catch (e) { toast(e.message, true); }
  };
}

  const show = (ok, html) => { $('nRes').innerHTML = `<div class="alert ${ok ? 'ok' : 'err'}"><div>${html}</div></div>`; };
  if ($('nlOn')) $('nlOn').onclick = async () => { try { await saveConfig({ features: { ...CONFIG.features, newsletter: true } }); applyNav(); toast('Activé — le formulaire est sur votre site'); drawNl(keepNow()); } catch (e) { toast(e.message, true); } };
  $('nlCsv').onclick = () => {
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [['Email', 'Inscrit le', 'Consentement le', 'Source', 'Langue', 'Statut'], ...LIST.ab.map((x) => [x.email, x.created_at.slice(0, 16).replace('T', ' '), (x.consent_at || '').slice(0, 16).replace('T', ' '), x.source, x.lang, x.actif ? 'actif' : 'désinscrit'])];
    dlBlob(new Blob(['\ufeff' + rows.map((r) => r.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), 'abonnes-' + new Date().toISOString().slice(0, 10) + '.csv');
  };
  $('nlAdd').onclick = () => {
    modal('Ajouter un abonné', `${fld('aEmail', 'Adresse email', '', 'client@exemple.fr', '', 'email')}<label class="check" style="margin-top:.5rem"><input type="checkbox" id="aConsent" /> Cette personne m'a demandé de recevoir mes emails</label><div class="hint" style="margin-top:.5rem;font-size:.78rem;color:var(--muted)">N'ajoutez jamais quelqu'un qui ne l'a pas demandé : c'est interdit par la loi (RGPD).</div>`, '<button class="btn" data-close>Annuler</button><button class="btn primary" id="aSave">Ajouter</button>');
    $('aSave').onclick = async () => {
      try { await api('/api/admin/abonnes', 'POST', { email: $('aEmail').value, consent: $('aConsent').checked }); closeModal(); toast('Abonné ajouté'); await VIEWS.newsletter(); } catch (e) { toast(e.message, true); }
    };
  };
  $('view').querySelectorAll('[data-nldel]').forEach((b) => (b.onclick = async () => {
    if (!confirm('Supprimer définitivement cet abonné ?')) return;
    try { await api('/api/admin/abonnes/' + b.dataset.nldel, 'DELETE'); LIST.ab = LIST.ab.filter((x) => x.id !== +b.dataset.nldel); drawNl(keepNow()); toast('Supprimé'); } catch (e) { toast(e.message, true); }
  }));
  $('nTest').onclick = async () => {
    $('nTest').disabled = true; $('nRes').innerHTML = '<span class="muted">Envoi du test…</span>';
    try { await api('/api/admin/campagnes', 'POST', { ...body(), test: true }); show(true, `Test envoyé à <b>${esc(CONFIG.pro_email)}</b>. Vérifiez votre boîte (et les indésirables).`); } catch (e) { show(false, esc(e.message)); }
    $('nTest').disabled = false;
  };
  $('nSend').onclick = async () => {
    if (!confirm(`Envoyer ce message à ${act} abonné${act > 1 ? 's' : ''} ? Cette action est définitive.`)) return;
    $('nSend').disabled = true; $('nRes').innerHTML = '<span class="muted">Envoi en cours… ne fermez pas la page.</span>';
    try { const r = await api('/api/admin/campagnes', 'POST', body()); toast(`Envoyé à ${r.sent} abonné${r.sent > 1 ? 's' : ''}`); LIST.ca = (await api('/api/admin/campagnes')).items; drawNl(); }
    catch (e) { show(false, esc(e.message)); $('nSend').disabled = false; }
  };
}

/* ── PDF d'un devis (le pro peut toujours l'ouvrir) ── */
async function openPdf(id, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(API + '/api/admin/devis/' + id + '/pdf', { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!r.ok) throw new Error('Impossible de générer le PDF (erreur ' + r.status + ')');
    dlBlob(await r.blob(), 'devis-' + id + '.pdf'); toast('PDF téléchargé');
  } catch (e) { toast(e.message, true); }
  if (btn) btn.disabled = false;
}

/* ── Sauvegarde complète ── */
async function exportAll(btn) {
  btn.disabled = true;
  try { const d = (await api('/api/admin/export')).data; dlBlob(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }), 'sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json'); toast('Sauvegarde téléchargée'); }
  catch (e) { toast(e.message, true); }
  btn.disabled = false;
}

if (TOKEN) boot();
</script>
</body>
</html>
