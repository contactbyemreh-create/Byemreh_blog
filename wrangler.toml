name = "byemreh-blog"
main = "src/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Expéditeur des emails (Resend).
# Tant que le domaine byemreh.fr n'est pas « Verified » dans Resend, garde onboarding@resend.dev
# (les emails ne partent alors que vers l'adresse de ton compte Resend).
# Une fois le domaine vérifié, remplace par : "ByEmreh <contact@byemreh.fr>"
[vars]
RESEND_FROM = "ByEmreh <onboarding@resend.dev>"

[[d1_databases]]
binding = "DB"
database_name = "byemreh-blog-db"
database_id = "3a813cc4-4004-4607-96e4-d6a5737cb22f"

# Domaine personnalisé
routes = [
  { pattern = "byemreh.fr", custom_domain = true },
  { pattern = "www.byemreh.fr", custom_domain = true }
]
